{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block footer %}
{% endblock %}

{% block body %}


<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

  <div class="card shadow-lg border-0" style="width: 420px; border-radius: 15px;">

    <div class="card-body p-4">

      <h3 class="text-center mb-4 fw-bold">Create Account</h3>

      <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter username">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="Enter email">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Create password">
        </div>

        <button type="submit" class="btn btn-danger w-100">
          Sign Up
        </button>

      </form>

      <p class="text-center mt-3 mb-0" style="font-size: 14px;">
        Already have an account?
        <a href="/login/" class="text-dark fw-bold text-decoration-none">Login</a>
      </p>

    </div>

  </div>

</div>

{% endblock %}
