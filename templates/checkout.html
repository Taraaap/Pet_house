
{% extends "base.html" %}
{% load static %}

{% block title %}Checkout{% endblock %}

{% block footer %}
{% endblock %}

{% block body %}

<div class="container mt-5 pt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0 rounded-4">

                <div class="card-header bg-dark text-white p-3 rounded-top-3">
                    <h2 class="mb-0 text-center fw-bold">
                        Checkout
                    </h2>
                </div>

                <div class="card-body p-4">

                    <form method="POST">
                        {% csrf_token %}

                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Full Name <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                   name="fullname"
                                   class="form-control"
                                   placeholder="Enter your full name"
                                   required>
                        </div>

                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Address <span class="text-danger">*</span>
                            </label>

                            <textarea name="address"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Enter delivery address"
                                      required></textarea>
                        </div>

                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Phone Number <span class="text-danger">*</span>
                            </label>

                            <input type="tel"
                                   name="phone"
                                   class="form-control"
                                   placeholder="98XXXXXXXX"
                                   pattern="[0-9]{10}"
                                   required>

                            <small class="text-muted">
                                Enter valid 10 digit phone number
                            </small>
                        </div>

                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Order Notes
                            </label>

                            <textarea name="notes"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Extra notes about your order"></textarea>
                        </div>

                        
                        <div class="mb-4">

                            <label class="form-label fw-bold d-block mb-3">
                                Payment Method <span class="text-danger">*</span>
                            </label>

                            <div class="card border p-3 mb-2">

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="payment_method"
                                           id="cod"
                                           value="Cash On Delivery"
                                           required>

                                    <label class="form-check-label fw-semibold" for="cod">
                                        Cash On Delivery
                                    </label>
                                </div>

                            </div>

                            <div class="card border p-3">

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="payment_method"
                                           id="online"
                                           value="Online Payment"
                                           required>

                                    <label class="form-check-label fw-semibold" for="online">
                                        Online Payment
                                    </label>
                                </div>

                            </div>

                        </div>

                        
                        <div class="bg-light rounded-3 p-3 mb-4">

                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal</span>
                                <span>Rs{{ cart_total }}</span>
                            </div>

                            <div class="d-flex justify-content-between mb-2">
                                <span>Shipping</span>
                                <span>Rs150</span>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span>Total</span>
                                <span class="text-danger">
                                    Rs{{ final_total }}
                                </span>
                            </div>

                        </div>

                        
                        <button type="submit"
                                class="btn btn-danger w-100 py-2 fw-bold rounded-3">
                            Place Order
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
